<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-dark text-light">

    <div class="display-2 text-center fw-bold">
        Weather App
    </div>
    <form
        class="text-center border border-danger-subtle border-5 m-5 p-4 rounded-4 d-flex flex-column align-items-center gap-3"
        onsubmit="fetchWeatherData(event)">
        <label class="h2 text-warning m-0">Enter the City</label>
        <input class="form-control text-center w-50" id="ip" type="text" placeholder="Enter name of the city" required>
        <button class="btn btn-outline-primary btn-sm px-4" type="submit">Get Weather</button>
    </form>
    <div id="display-weather">

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
